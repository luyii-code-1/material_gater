name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: material-gater-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            artifact: material-gater-macos-arm64
          - name: Windows x64
            os: windows-2022
            artifact: material-gater-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          nasm -v

      - name: Check formatting and code
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          npm run check

      - name: Run Rust tests
        run: npm test

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        run: |
          npm run dist -- --bundles app,dmg
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Material Gater.app" "src-tauri/target/release/bundle/Material-Gater-macOS-arm64.zip"

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run dist -- --bundles nsis
          Copy-Item "src-tauri/target/release/material-gater.exe" "src-tauri/target/release/bundle/Material-Gater-Windows-x64-Portable.exe"

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/*.zip

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*-Portable.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Material Gater ${GITHUB_REF_NAME#v}"
