[package]
name = "material-gater"
version = "0.7.0"
description = "跨平台素材拷贝、筛选与虚拟素材库管理工具"
authors = ["luyii-code-1"]
license = "MIT"
repository = "https://github.com/luyii-code-1/material_gater"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "material_gater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
log = "0.4"
notify = "8"
regex = "1"
same-file = "1"
remotefs = { version = "0.3.1", default-features = false }
remotefs-ftp = { version = "0.4.0", default-features = false }
remotefs-ssh = { version = "0.8.5", default-features = false, features = ["russh"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smb2 = "0.13.1"
tauri = { version = "2.11.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
